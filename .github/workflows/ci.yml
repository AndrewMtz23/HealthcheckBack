name: Backend CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logs-integration:
    name: Logs / Cross-service PostgreSQL integration
    needs: node-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHON_BINARY: python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/link-monitor-service/go.mod
          cache-dependency-path: services/link-monitor-service/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-compiled-services
          path: .
      - name: Install integration dependencies
        run: |
          for service in services/auth-service services/news-service services/notification-service; do
            npm ci --prefix "$service"
          done
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/ml-service/requirements-ci.txt
      - name: Start isolated PostgreSQL cluster
        run: |
          mkdir -p ../.healthcheck-logs/phase00-pg
          "$(pg_config --bindir)/initdb" -D ../.healthcheck-logs/phase00-pg -U phase00 -A trust
          # The runner cannot write to PostgreSQL's system socket directory.
          # These tests connect over TCP, so no Unix socket is needed.
          "$(pg_config --bindir)/pg_ctl" -D ../.healthcheck-logs/phase00-pg -l ../.healthcheck-logs/logs-pg.log -o "-p 5543 -h 127.0.0.1 -c unix_socket_directories=''" -w start || {
            cat ../.healthcheck-logs/logs-pg.log
            exit 1
          }
      - name: Verify Logs transactions, permissions, exports and historical imports
        run: node --test tests/system-logs-*-integration.cjs
      - name: Stop isolated PostgreSQL
        if: always()
        run: '"$(pg_config --bindir)/pg_ctl" -D ../.healthcheck-logs/phase00-pg -m fast -w stop || true'

  node-build:
    name: Node / Compile services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api-gateway/package-lock.json
            services/auth-service/package-lock.json
            services/news-service/package-lock.json
            services/notification-service/package-lock.json
      - name: Install service dependencies
        run: |
          for service in api-gateway services/auth-service services/news-service services/notification-service; do
            npm ci --prefix "$service"
          done
      - name: Compile TypeScript services
        run: |
          for service in api-gateway services/auth-service services/news-service; do
            npm run build --prefix "$service"
          done
      - name: Share compiled services with regression tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-compiled-services
          path: |
            api-gateway/dist/
            services/auth-service/dist/
            services/news-service/dist/
          if-no-files-found: error
          retention-days: 1

  node-tests:
    name: Node / Regression tests
    needs: node-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api-gateway/package-lock.json
            services/auth-service/package-lock.json
            services/news-service/package-lock.json
            services/notification-service/package-lock.json
      - name: Install service dependencies
        run: |
          for service in api-gateway services/auth-service services/news-service services/notification-service; do
            npm ci --prefix "$service"
          done
      - name: Restore compiled services
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-compiled-services
          path: .
      - run: node --test tests/*.test.cjs

  python:
    name: Python / Offline regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENAI_API_KEY: synthetic-ci-never-used
      PYTHONPATH: services/ml-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/ml-service/requirements.txt
            services/ml-service/requirements-ci.txt
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/ml-service/requirements-ci.txt
          python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s services/ml-service/tests -p 'test_*.py' -v

  go-checks:
    name: Go / Format, vet and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/link-monitor-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/link-monitor-service/go.mod
          cache-dependency-path: services/link-monitor-service/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod download
      - run: go vet ./...
      - name: Run unit tests with race detection
        # Database integration tests skip when no isolated DSN is provided.
        run: go test -race -count=1 -timeout=5m ./...

  go-integration:
    name: Go / PostgreSQL integration
    needs: go-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/link-monitor-service
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monitor_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: link_monitor_test_ci
          # Retain the destructive integration tests' existing safety guard.
          PGDATA: /var/lib/postgresql/data/.healthcheck-logs/link-monitor/pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor_test -d link_monitor_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINK_MONITOR_TEST_DSN: postgres://monitor_test:synthetic-ci-only@127.0.0.1:5432/link_monitor_test_ci?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/link-monitor-service/go.mod
          cache-dependency-path: services/link-monitor-service/go.sum
      - run: go mod download
      - name: Run database and HTTP flow tests with race detection
        run: go test -race -count=1 -timeout=5m ./internal/store ./internal/httpapi

  go-build:
    name: Go / Build binary
    needs: go-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/link-monitor-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/link-monitor-service/go.mod
          cache-dependency-path: services/link-monitor-service/go.sum
      - run: go mod download
      - run: go build ./cmd/link-monitor
