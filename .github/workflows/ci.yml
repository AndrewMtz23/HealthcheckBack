name: Backend CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node builds and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api-gateway/package-lock.json
            services/auth-service/package-lock.json
            services/news-service/package-lock.json
            services/notification-service/package-lock.json
      - name: Install service dependencies
        run: |
          for service in api-gateway services/auth-service services/news-service services/notification-service; do
            npm ci --prefix "$service"
          done
      - name: Compile TypeScript services
        run: |
          for service in api-gateway services/auth-service services/news-service; do
            npm run build --prefix "$service"
          done
      - run: node --test tests/*.test.cjs

  python:
    name: Python offline regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENAI_API_KEY: synthetic-ci-never-used
      PYTHONPATH: services/ml-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/ml-service/requirements.txt
            services/ml-service/requirements-ci.txt
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/ml-service/requirements-ci.txt
          python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s services/ml-service/tests -p 'test_*.py' -v

  go:
    name: Go race tests and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/link-monitor-service
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monitor_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: link_monitor_test_ci
          # Retain the destructive integration tests' existing safety guard.
          PGDATA: /var/lib/postgresql/data/.healthcheck-logs/link-monitor/pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor_test -d link_monitor_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINK_MONITOR_TEST_DSN: postgres://monitor_test:synthetic-ci-only@127.0.0.1:5432/link_monitor_test_ci?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/link-monitor-service/go.mod
          cache-dependency-path: services/link-monitor-service/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=5m ./...
      - run: go build ./cmd/link-monitor
